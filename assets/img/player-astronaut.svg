<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Personaje Astronauta: Casco Esférico Ajustado y Centrado -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- Casco - Capa Sombra Profunda (Radio reducido a 24.5, cy bajado a 34) -->
    <circle cx="32" cy="36" r="24.5" fill="#0A3A52" />

    <!-- Casco - Cuerpo Principal con Bisel de Iluminación -->
    <circle cx="32" cy="36" r="23.5" fill="#0F5070" stroke="#1A7090" stroke-width="1.5" />

    <!-- Bisel de Luz Superior en el Casco -->
    <ellipse cx="32" cy="15.5" rx="12" ry="4" fill="#48CAE4" opacity="0.35" />

    <!-- Visor Oscuro Amplio -->
    <ellipse cx="32" cy="36" rx="18" ry="15" fill="#040E1A" stroke="#0A4060" stroke-width="1.4" />

    <!-- Reflejos de Luz en el Visor -->
    <ellipse cx="24" cy="25" rx="7" ry="4" fill="#48CAE4" opacity="0.45"
      transform="rotate(-28, 24, 25)" />
    <ellipse cx="22" cy="23.5" rx="3.2" ry="1.6" fill="#C0F8FF" opacity="0.85"
      transform="rotate(-28, 22, 23.5)" />

    <!-- Ojos Grandes Expresivos -->
    <!-- Ojo Izquierdo -->
    <circle cx="25.5" cy="35.5" r="4.6" fill="#48CAE4" opacity="0.85" />
    <circle cx="25.5" cy="35.5" r="2.4" fill="#050C14" />
    <circle cx="24.2" cy="34.2" r="1.0" fill="#FFFFFF" />
    <circle cx="26.7" cy="36.7" r="0.5" fill="#C0F8FF" opacity="0.8" />

    <!-- Ojo Derecho -->
    <circle cx="38.5" cy="35.5" r="4.6" fill="#48CAE4" opacity="0.85" />
    <circle cx="38.5" cy="35.5" r="2.4" fill="#050C14" />
    <circle cx="37.2" cy="34.2" r="1.0" fill="#FFFFFF" />
    <circle cx="39.7" cy="36.7" r="0.5" fill="#C0F8FF" opacity="0.8" />

    <!-- Borde Exterior Tecnológico / Anillo de Blindaje -->
    <circle cx="32" cy="36" r="24.5" fill="none" stroke="#48CAE4" stroke-width="1.2" opacity="0.75" />

    <!-- Antena Superior / Baliza de Señal (Completamente dentro del ViewBox) -->
    <line x1="32" y1="14" x2="32" y2="5" stroke="#1A7090" stroke-width="1.8" />
    <circle cx="32" cy="5" r="2.5" fill="#48CAE4" stroke="#80E4F8" stroke-width="0.8" />
    <circle cx="32" cy="4.5" r="1" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>