<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Piloto: Astronauta canchero con gafas de aviador espacial y micrófono de cabina -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- 1. AURICULARES DE COMUNICACIONES (Orejeras laterales de piloto) -->
    <rect x="6" y="29" width="4.5" height="14" rx="2.2" fill="#0A3A52" stroke="#1A7090" stroke-width="1" />
    <circle cx="8.2" cy="36" r="1.4" fill="#48CAE4" opacity="0.7" />

    <rect x="53.5" y="29" width="4.5" height="14" rx="2.2" fill="#0A3A52" stroke="#1A7090" stroke-width="1" />
    <circle cx="55.8" cy="36" r="1.4" fill="#48CAE4" opacity="0.7" />

    <!-- 2. CUERPO PRINCIPAL DEL CASCO -->
    <!-- Casco - Capa Sombra Profunda -->
    <circle cx="32" cy="36" r="24.5" fill="#0A3A52" />

    <!-- Casco - Cuerpo Principal con Bisel de Iluminación -->
    <circle cx="32" cy="36" r="23.5" fill="#0F5070" stroke="#1A7090" stroke-width="1.5" />

    <!-- Bisel de Luz Superior en el Casco -->
    <ellipse cx="32" cy="15.5" rx="12" ry="4" fill="#48CAE4" opacity="0.35" />

    <!-- Visor Oscuro Amplio -->
    <ellipse cx="32" cy="36" rx="18" ry="15" fill="#040E1A" stroke="#0A4060" stroke-width="1.4" />

    <!-- 3. GAFAS DE SOL ESPACIALES (Estilo Aviador Cósmico) -->
    <!-- Lente Izquierda -->
    <path d="M 19 32 Q 25 30.5 29.5 32 L 29 38.5 Q 24.5 41.5 19.5 38.5 Z" fill="#020812" stroke="#48CAE4" stroke-width="1.2" />
    <!-- Reflejos cromados en lente izquierda -->
    <polygon points="21,33 24,33 22,39 20,38" fill="#48CAE4" opacity="0.45" />
    <polygon points="22.8,33.5 24.8,33.5 23.2,37 21.8,37" fill="#FFFFFF" opacity="0.85" />

    <!-- Lente Derecha -->
    <path d="M 34.5 32 Q 39 30.5 45 32 L 44.5 38.5 Q 39.5 41.5 35 38.5 Z" fill="#020812" stroke="#48CAE4" stroke-width="1.2" />
    <!-- Reflejos cromados en lente derecha -->
    <polygon points="36.5,33 39.5,33 37.5,39 35.5,38" fill="#48CAE4" opacity="0.45" />
    <polygon points="38.3,33.5 40.3,33.5 38.7,37 37.3,37" fill="#FFFFFF" opacity="0.85" />

    <!-- Puente Metálico de las Gafas -->
    <line x1="29.5" y1="32.5" x2="34.5" y2="32.5" stroke="#48CAE4" stroke-width="1.4" />
    <circle cx="32" cy="32.5" r="0.7" fill="#FFFFFF" />

    <!-- Sonrisa / Mueca de Confianza sutil -->
    <path d="M 29.5 44 Q 32 46 34.5 44" stroke="#48CAE4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- 4. MICRÓFONO DE CABINA (Boom mic curvo desde el auricular izquierdo) -->
    <path d="M 8.5 38 Q 14 47 24 45.5" fill="none" stroke="#1A7090" stroke-width="1.5" stroke-linecap="round" />
    <ellipse cx="24.5" cy="45.5" rx="2" ry="1.4" fill="#0A3A52" stroke="#48CAE4" stroke-width="0.8" />
    <circle cx="24.5" cy="45.5" r="0.5" fill="#48CAE4" />

    <!-- Borde Exterior Tecnológico / Anillo de Blindaje -->
    <circle cx="32" cy="36" r="24.5" fill="none" stroke="#48CAE4" stroke-width="1.2" opacity="0.75" />

    <!-- Antena Superior de Comunicaciones con Doble Aleta Aerodinámica -->
    <line x1="32" y1="14" x2="32" y2="5" stroke="#1A7090" stroke-width="1.8" />
    <path d="M 29 11 L 35 11 L 32 7 Z" fill="#0A3A52" stroke="#1A7090" stroke-width="0.8" />
    <circle cx="32" cy="5" r="2.2" fill="#48CAE4" stroke="#80E4F8" stroke-width="0.8" />
    <circle cx="32" cy="4.5" r="0.9" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
